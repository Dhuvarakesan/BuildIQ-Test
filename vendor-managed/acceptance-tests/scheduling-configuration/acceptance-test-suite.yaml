    event_names:
      - appointment_type_configuration_changed
      - direct_bookable_flag_changed
      - staff_confirmation_rule_changed
    required_where_vendor_supported:
      - occurred_at
      - actor_user_id
      - actor_display_name
      - actor_role
      - configuration_area
      - appointment_type_id
      - appointment_type_display_name
      - changed_setting
      - previous_value_redacted
      - new_value_redacted
      - vendor_correlation_id
  denied_configuration_change:
    event_names:
      - appointment_type_configuration_change_denied
    required_where_vendor_supported:
      - occurred_at
      - actor_user_id
      - actor_display_name
      - actor_role
      - configuration_area
      - attempted_action
      - denial_reason
      - vendor_correlation_id
  prohibited_in_all_evidence:
    - patient_name
    - patient_phone
    - patient_email
    - date_of_birth
    - full_appointment_reason
    - raw_ehr_payload
    - credentials
    - otp_code

